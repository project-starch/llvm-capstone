if not "Capstone" in config.root.targets:
    config.unsupported = True

# One spelling of the production llc invocation, so a test's -O0/-O1 arms are
# mechanical and identical across files:
#     ; RUN: %llc-cap -O1 < %s -o /dev/null
# Every failure this target has had at -O1 was a "Cannot select" or a verifier
# fault rather than CHECK-text drift, so a verifier-only arm per input catches
# that class at zero CHECK-maintenance cost.
config.substitutions.append(
    ("%llc-cap", "llc -mtriple=capstone64 -mattr=+m -verify-machineinstrs"))
