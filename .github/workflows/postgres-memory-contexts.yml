name: PostgreSQL memory contexts

on:
  pull_request:
    paths:
      - 'capstone/ports/postgres/**'
      - 'capstone/runtime/**'
      - '.github/workflows/postgres-memory-contexts.yml'
  push:
    branches: [postgres/1-memory-contexts, postgres/2-memory-profiles]
    paths:
      - 'capstone/ports/postgres/**'
      - 'capstone/runtime/**'
      - '.github/workflows/postgres-memory-contexts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgres-memory-contexts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: capstone/ports/postgres
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Install build and formatting tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential python3-venv bison flex libssl-dev libzstd-dev patch
          python3 -m venv /tmp/pg-replay-tools
          /tmp/pg-replay-tools/bin/pip install -r requirements-dev.txt
      - name: Check Python formatting
        run: |
          /tmp/pg-replay-tools/bin/black --check .
      - name: Configure, build and test the native port
        run: |
          source ../../tests/capstone-test-env.sh
          cmake --preset native
          cmake --build --preset native
          ctest --preset native
      - name: Check the incremental build is idle
        run: |
          source ../../tests/capstone-test-env.sh
          output=$(cmake --build --preset native -- -n)
          printf '%s\n' "$output"
          test "$output" = 'ninja: no work to do.'
