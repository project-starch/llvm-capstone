# SPEC CPU2017 1.0.2 config for the plain RISC-V arm of the profiling comparison (a research
# build, never reportable): the same sources (the src.alt packages), flags and portability
# settings as capstone-virtual.cfg, compiled by a RISCV-target clang built from the same
# llvm-capstone source with a pristine musl 1.2.5 (recipes/plain-toolchain.sh's rv-cc:
# --target=riscv64-unknown-linux-musl -march=rv64imafd -mabi=lp64 -static -no-pie). The virtual
# SDK's Capstone code uses the F and D instructions with the lp64 convention too
# (VirtualCodegen.cmake), so the two arms differ in the capability machinery, not in the
# floating-point model.
#
#   %{rvcc}         the plain compiler driver (recipes/plain-toolchain.sh writes it)
#   %{arm_label}    the arm; names the executables and the run directories (default riscv-plain)
#   %{kit}          this kit
#
# Running: as capstone-virtual.cfg, through tools/capstone-run.sh, when %{vm_state} is defined;
# a plain image runs in the guest directly (CAPSTONE_SPEC_PLAIN=1), not through the launcher.

%ifndef %{rvcc}
%   error define rvcc=<plain compiler driver>
%endif
%ifndef %{kit}
%   error define kit=<this kit>
%endif
%ifndef %{arm_label}
%   define arm_label riscv-plain
%endif

command_add_redirect = 1
ignore_errors        = 0
iterations           = 1
label                = %{arm_label}
line_width           = 1020
log_line_width       = 1020
makeflags            = --jobs=16
output_format        = txt
preenv               = 1
reportable           = 0
tune                 = base
verify_binaries      = 1

intrate,fprate:
   copies            = 1

default:
   CC                     = %{rvcc}
   CC_VERSION_OPTION      = --version
   CXX                    = /bin/false
   CXX_VERSION_OPTION     = --version
   FC                     = /bin/false
   FC_VERSION_OPTION      = --version
   sw_base_ptrsize        = 64-bit

default=base:
   OPTIMIZE               = -O2

default:
   EXTRA_PORTABILITY      = -DSPEC_LP64

# The same research source changes as the Capstone arm (packages/, srcalt/*/README): portability
# fixes only, so both arms compile the same sources.
500.perlbench_r,502.gcc_r,505.mcf_r:
   srcalt                 = capstone

500.perlbench_r:
   # RISC-V converts negative floats to unsigned like AArch64, not like x86.
   # musl's FILE is opaque, so perlio must not read glibc's buffer fields,
   # and musl's <sys/file.h> does not pull in <fcntl.h> as glibc's does.
   PORTABILITY            = -DSPEC_LINUX_AARCH64 -D_DEFAULT_SOURCE -DSPEC_NO_USE_STDIO_PTR -DSPEC_NO_USE_STDIO_BASE -DI_FCNTL

525.x264_r:
   # The bundled GNU getopt includes <string.h> only under glibc.
   PORTABILITY            = -fcommon -DHAVE_STRING_H=1

538.imagick_r:
   # musl has posix_memalign, which SPEC's magick-baseconfig.h leaves undeclared; the flag states
   # what the platform has (the Capstone arm needs it for a tagged pointer, this arm for parity).
   PORTABILITY            = -DMAGICKCORE_HAVE_POSIX_MEMALIGN=1

%ifdef %{vm_state}
default:
   submit                     = %{kit}/tools/capstone-run.sh $command
   use_submit_for_compare     = 1
   preENV_CAPSTONE_VM_STATE   = %{vm_state}
   preENV_CAPSTONE_VM_SHARE   = %{vm_share}
   preENV_CAPSTONE_VM_HOST    = %{vm_host}
   preENV_CAPSTONE_SPEC_LDECOD = %{ldecod_host}
   preENV_CAPSTONE_SPEC_RECORD = %{record}
   preENV_CAPSTONE_SPEC_KIT   = %{kit}
   preENV_CAPSTONE_SPEC_PLAIN = 1
%endif
