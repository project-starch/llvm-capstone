# SPEC CPU2017 1.0.2 config for the virtual Capstone profile (research build, never reportable).
#
# runcpu builds with the virtual application SDK on the build host and runs every invocation
# through tools/capstone-run.sh, which starts Capstone images in a QEMU guest (capstone_vm) and
# SPEC's own tools on the host. runcpu validates the outputs itself. tools/build.sh and
# tools/run.sh supply every %{...} below; nothing here names a working directory.
#
#   %{sdk}          virtual application SDK (sdk.json + capstone-cc) of the arm
#   %{arm_label}    the arm's label (manifest `arms`), default capstone-virtual
#   %{kit}          this kit
#   %{vm_state}     capstone_vm state directory of the guest booted for this run
#   %{vm_share}     host directory the guest mounts at /mnt/host (the SPEC tree)
#   %{vm_host}      the toolchain source's capstone/runtime/host (python -m capstone_vm)
#   %{ldecod_host}  host build of 525.x264_r's input generator (tools/build-host-ldecod.sh)
#   %{record}       directory that collects the per-invocation records of this run

%ifndef %{sdk}
%   error define sdk=<virtual application SDK directory>
%endif
%ifndef %{kit}
%   error define kit=<this kit>
%endif
# The arm (manifest.lock.json `arms`): its label names the executables and the run directories, its SDK
# is %{sdk}. Without a definition this is the qualified configuration.
%ifndef %{arm_label}
%   define arm_label capstone-virtual
%endif

command_add_redirect = 1
ignore_errors        = 0
iterations           = 1
label                = %{arm_label}
line_width           = 1020
log_line_width       = 1020
makeflags            = --jobs=16
output_format        = txt
preenv               = 1
reportable           = 0
tune                 = base
verify_binaries      = 1

intrate,fprate:
   copies            = 1

default:
   CC                     = %{sdk}/capstone-cc
   CC_VERSION_OPTION      = --version
   CXX                    = /bin/false
   CXX_VERSION_OPTION     = --version
   FC                     = /bin/false
   FC_VERSION_OPTION      = --version
   sw_base_ptrsize        = 128-bit capabilities, 64-bit long

default=base:
   OPTIMIZE               = -O2

default:
   # long is 64 bits; pointers are 128-bit capabilities, which no SPEC data
   # model names. LP64 is the closest one, and every use of it is a finding.
   EXTRA_PORTABILITY      = -DSPEC_LP64

# Research source changes: runcpu applies these src.alt packages (packages/, srcalt/*/README)
# in the build directory. The installed sources stay as SPEC ships them.
500.perlbench_r,502.gcc_r,505.mcf_r:
   srcalt                 = capstone

500.perlbench_r:
   # RISC-V converts negative floats to unsigned like AArch64, not like x86.
   # musl's FILE is opaque, so perlio must not read glibc's buffer fields,
   # and musl's <sys/file.h> does not pull in <fcntl.h> as glibc's does.
   PORTABILITY            = -DSPEC_LINUX_AARCH64 -D_DEFAULT_SOURCE -DSPEC_NO_USE_STDIO_PTR -DSPEC_NO_USE_STDIO_BASE -DI_FCNTL

525.x264_r:
   # The bundled GNU getopt includes <string.h> only under glibc.
   PORTABILITY            = -fcommon -DHAVE_STRING_H=1

538.imagick_r:
   # musl has posix_memalign, which SPEC's magick-baseconfig.h leaves
   # undeclared. Without it ImageMagick aligns a malloc'd pointer through
   # size_t ((size_t)p + 63) & ~63) and stores through the result; a size_t
   # is an integer here, so that pointer has no tag (cause 24 in
   # AllocateSemaphoreInfo). The flag states what the platform has.
   PORTABILITY            = -DMAGICKCORE_HAVE_POSIX_MEMALIGN=1

# Running. Every benchmark invocation, input generation and validation command goes through the
# wrapper; it decides where each one runs and refuses anything it does not know.
%ifdef %{vm_state}
default:
   submit                     = %{kit}/tools/capstone-run.sh $command
   use_submit_for_compare     = 1
   preENV_CAPSTONE_VM_STATE   = %{vm_state}
   preENV_CAPSTONE_VM_SHARE   = %{vm_share}
   preENV_CAPSTONE_VM_HOST    = %{vm_host}
   preENV_CAPSTONE_SPEC_LDECOD = %{ldecod_host}
   preENV_CAPSTONE_SPEC_RECORD = %{record}
   preENV_CAPSTONE_SPEC_KIT   = %{kit}
%endif
