# R-26 directed tests (CCSRRW -> younger load CPMP check). Kept OUT of testlist_capstone.yaml: r26-v2-ldmiss is
# expected to FAIL (tohost exit code 11 = hazard) until the RTL flushes or interlocks after a capability CSR write.
# Run the deciding arm with a 40-cycle memory: DEFINE=+define+S12_MEM_DELAY=40 (see the history note of 2026-09-08).
- test: r26-diag-nodelay
  iterations: 1
  path_var: TESTS_PATH
  gcc_opts: "-static -mcmodel=medany -fvisibility=hidden -nostdlib -nostartfiles -I<path_var>/riscv-tests/isa/macros/scalar/ -I<path_var>/riscv-tests/env/p/"
  asm_tests: <path_var>/custom/capstone/r26-diag-nodelay.S
